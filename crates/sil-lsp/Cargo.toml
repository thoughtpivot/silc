[package]
name = "sil-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Silc language server (LSP)"

[[bin]]
name = "sil-lsp"
path = "src/main.rs"

[dependencies]
sil-ide = { workspace = true }
sil-core = { workspace = true }
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sil-core = { workspace = true }
serde_json = "1"
