[package]
name = "sil-training"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Provider-neutral silclm prompt generation and compiler-backed dataset banking"
readme = "README.md"
keywords = ["silc", "training", "dataset", "compiler", "llm"]
categories = ["development-tools", "compilers", "artificial-intelligence"]

[[bin]]
name = "sil-training"
path = "src/main.rs"

[dependencies]
sil-core = { workspace = true }
sil-parser = { workspace = true }
sil-router = { workspace = true }
sil-codegen = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
