[package]
name = "silc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ThoughtPivot Silc compiler CLI"

[[bin]]
name = "silc"
path = "src/main.rs"

[dependencies]
sil-core = { workspace = true }
sil-lexer = { workspace = true }
sil-parser = { workspace = true }
sil-router = { workspace = true }
sil-codegen = { workspace = true }
sil-ipc = { workspace = true }
sil-rlm = { workspace = true }
ureq = "2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
ureq = "2"
