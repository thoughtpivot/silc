name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: fmt + check + test (${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace --lib -- --test-threads=1

      - name: Codegen smoke (0.5.0 apps)
        run: |
          cargo test -p sil-codegen emits_runnable_feedback_app
          cargo test -p sil-codegen emits_chat_app_with_llm_processor
          cargo test -p sil-codegen emits_resource_app_with_actions

      - name: Build standalone example apps
        run: |
          cargo build -p silc
          cargo test -p silc --test docs_conformance -- --test-threads=1
          find examples -name main.silc -print | sort | while read -r src; do
            ./target/debug/silc build "$src"
          done

      - name: Dual-surface end-to-end
        run: |
          cargo test -p silc --test scored_form_e2e -- --test-threads=1
          cargo test -p silc --test shopping_e2e -- --test-threads=1
          cargo test -p silc --test chat_e2e chat_assistant_builds_dual_surface -- --test-threads=1
          cargo test -p silc --test inventory_e2e -- --test-threads=1

      - name: Concurrent scored_form correctness
        run: |
          # The e2e step above SIGKILLs its supervisor; its Bun worker can
          # outlive it on 18080 and answer /health with no supervisor behind it.
          lsof -ti:18080 | xargs kill -9 2>/dev/null || true
          SILC_HTTP_PORT=18080 ./target/debug/silc crates/silc/tests/fixtures/scored_form.silc > /tmp/silc-run.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/health
          for i in $(seq 1 25); do
            curl -sf -X POST http://127.0.0.1:18080/submit \
              -H 'content-type: application/json' \
              -d "{\"author\":\"ci$i\",\"text\":\"hello from ci $i\"}" >/tmp/resp$i.json
          done
          kill -KILL $PID || true
          wait $PID || true
          test -f crates/silc/tests/fixtures/.runtime/scored_form/data/app.db

  pipeline-integration:
    name: scraper + ONNX pipeline integration
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Cache Silc runtimes, models, and wheels
        uses: actions/cache@v4
        with:
          path: |
            ~/.silc
            ~/.cache/pip
          key: silc-0.7.0-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/sil-codegen/templates/*requirements.txt', 'crates/sil-core/src/model_catalog.rs') }}

      - name: Build all standalone examples
        run: |
          cargo build -p silc
          find examples -name main.silc -print | sort | while read -r src; do
            ./target/debug/silc build "$src"
          done

      - name: Local HTTP to ONNX to SQLite
        run: cargo test -p silc --test pipeline_e2e -- --ignored --test-threads=1

  # Publishes stable tags to crates.io. The job id stays `release-plz-release`
  # and the workflow file stays `ci.yml` so existing crates.io Trusted
  # Publishers (workflow filename ci.yml, no environment) keep matching.
  # Do not set a long-lived CARGO_REGISTRY_TOKEN secret. Prerelease tags
  # (vX.Y.Z-dev.N) are ignored by scripts/publish-crates.py.
  release-plz-release:
    name: publish crates.io
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Plan crates.io publish
        id: plan
        run: python3 scripts/publish-crates.py --plan >> "$GITHUB_OUTPUT"

      - name: crates.io trusted publishing token
        id: auth
        if: steps.plan.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        if: steps.plan.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/publish-crates.py
