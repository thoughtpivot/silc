name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: fmt + check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace -- --test-threads=1

      - name: Generate LLM portal workers (offline smoke)
        run: cargo test -p sil-codegen emits_runnable_llm_chat_workers

      - name: Build feedback portal
        run: cargo build -p silc && ./target/debug/silc build examples/feedback_portal.silc

      - name: Concurrent correctness (short)
        run: |
          ./target/debug/silc examples/feedback_portal.silc > /tmp/silc-run.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/health
          for i in $(seq 1 25); do
            curl -sf -X POST http://127.0.0.1:18080/submit \
              -H 'content-type: application/json' \
              -d "{\"author\":\"ci$i\",\"text\":\"hello from ci $i\"}" >/tmp/resp$i.json
          done
          kill -INT $PID || true
          wait $PID || true
          test -f examples/.runtime/feedback_portal/data/feedback.db
