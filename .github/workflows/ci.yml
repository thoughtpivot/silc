name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: fmt + check + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: System packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace --lib -- --test-threads=1

      - name: Codegen smoke (0.2.0 apps)
        run: |
          cargo test -p sil-codegen emits_runnable_feedback_app
          cargo test -p sil-codegen emits_chat_app_with_llm_processor
          cargo test -p sil-codegen emits_resource_app_with_actions

      - name: Build standalone example apps
        run: |
          cargo build -p silc
          ./target/debug/silc build examples/chatApp/main.silc
          ./target/debug/silc build examples/inventoryApp/main.silc

      - name: Dual-surface end-to-end
        run: |
          cargo test -p silc --test scored_form_e2e -- --test-threads=1
          cargo test -p silc --test shopping_e2e -- --test-threads=1
          cargo test -p silc --test chat_e2e chat_assistant_builds_dual_surface -- --test-threads=1
          cargo test -p silc --test inventory_e2e -- --test-threads=1

      - name: Concurrent scored_form correctness
        run: |
          ./target/debug/silc crates/silc/tests/fixtures/scored_form.silc > /tmp/silc-run.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18080/health
          for i in $(seq 1 25); do
            curl -sf -X POST http://127.0.0.1:18080/submit \
              -H 'content-type: application/json' \
              -d "{\"author\":\"ci$i\",\"text\":\"hello from ci $i\"}" >/tmp/resp$i.json
          done
          kill -KILL $PID || true
          wait $PID || true
          test -f crates/silc/tests/fixtures/.runtime/scored_form/data/app.db

  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
