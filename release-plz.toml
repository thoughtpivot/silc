[workspace]
# Pre-1.0 SemVer: breaking changes bump the minor version (0.x → 0.(x+1)).
semver_check = false
# Keep publish disabled until a named crates.io owner has:
#   1. published 0.6.0 once with an API token (Trusted Publishing cannot create new crates)
#   2. configured Trusted Publishing on crates.io for thoughtpivot/silc
#      workflow `.github/workflows/ci.yml`, job `release-plz-release`
# Then set `publish = true`. Crates with Cargo.toml `publish = false` (sil-ide,
# sil-lsp) stay unpublished either way.
publish = false
release_always = false

[changelog]
header = """# Changelog

All notable changes to Silc are documented here.
Silc remains pre-1.0; this project follows SemVer 0.x with Conventional Commits.
"""
