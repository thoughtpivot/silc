[workspace]
resolver = "2"
members = [
    "crates/silc",
    "crates/sil-lexer",
    "crates/sil-core",
    "crates/sil-parser",
    "crates/sil-router",
    "crates/sil-codegen",
    "crates/sil-ipc",
    "crates/sil-training",
    "crates/sil-rlm",
    "crates/sil-ide",
    "crates/sil-lsp",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/thoughtpivot/silc"
homepage = "https://github.com/thoughtpivot/silc"
authors = ["ThoughtPivot"]
rust-version = "1.82"

[workspace.dependencies]
sil-core = { version = "0.7.0", path = "crates/sil-core" }
sil-lexer = { version = "0.7.0", path = "crates/sil-lexer" }
sil-parser = { version = "0.7.0", path = "crates/sil-parser" }
sil-router = { version = "0.7.0", path = "crates/sil-router" }
sil-codegen = { version = "0.7.0", path = "crates/sil-codegen" }
sil-ipc = { version = "0.7.0", path = "crates/sil-ipc" }
sil-training = { version = "0.7.0", path = "crates/sil-training" }
sil-rlm = { version = "0.7.0", path = "crates/sil-rlm" }
sil-ide = { version = "0.7.0", path = "crates/sil-ide" }
